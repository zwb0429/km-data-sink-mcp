# km-data-sink-mcp 独立 compose（不影响上级 /home/km/kmDoker/docker-compose.yml）
# 与 redis/mysql 范例风格一致：restart unless-stopped + TZ + healthcheck + 数据卷挂载
#
# 网络说明：加入外部网络 kmdoker_default（mysql/redis 容器所在网络），
# 直接用容器名 mysql 作为 host 访问（Docker 内置 DNS 解析）。

services:
  km-data-sink-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: km-data-sink-mcp:1.0.2
    container_name: km-data-sink-mcp
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # MySQL 连接密码（config.yaml 中 password_env: SINK_DB_PASSWORD 引用）
      # 生产环境建议用 .env 文件或部署平台密钥注入，勿将真实密码提交到代码库
      SINK_DB_PASSWORD: "${SINK_DB_PASSWORD:?请在环境变量或 .env 中设置 SINK_DB_PASSWORD}"
      # JVM 内存上限（按需调整）
      JAVA_OPTS: "-Xms128m -Xmx512m"
    # MCP server 为 stdio 常驻进程：stdin 保持打开（不传 --config，Dockerfile ENTRYPOINT 已带）
    stdin_open: true
    # healthcheck：stdio MCP server 无 HTTP 端点，无法用旁路 JVM 启动探针（会超时）。
    # 改为检查主进程（PID 1 = java）存活（纯 MySQL 部署，无本地数据文件可查）
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./logs:/app/logs          # 日志持久化
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kmdoker_default

# 外部网络：由上级 /home/km/kmDoker/docker-compose.yml 创建（mysql/redis/minio 所在）
networks:
  kmdoker_default:
    external: true
